<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Restaurant Plan Editor — 2D floor plan &amp; 3D model</title>
<style>
:root{--ink:#1d2733;--muted:#5d6b7a;--line:#d5dae1;--panel:#f4f6f8;--card:#fff;--top:#16202c;--acc:#0b7285;--acc2:#e8f4f6;--sel:#f08c00;--warn:#c92a2a;--ok:#2b8a3e;--amber:#b35400}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;color:var(--ink);background:#e9ecef;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;position:relative}
#topbar{background:var(--top);color:#fff;display:flex;gap:6px;align-items:center;padding:5px 8px;flex-wrap:wrap;z-index:30}
#topbar .brand{font-weight:700;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
#topbar .brand small{font-weight:400;opacity:.7;margin-left:6px}
.grp{display:flex;gap:2px;align-items:center;background:rgba(255,255,255,.07);border-radius:7px;padding:2px}
button{min-width:24px;min-height:24px}
:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
@media (pointer:coarse),(max-width:700px){button,.tb,.chip,.ic{min-height:36px;min-width:36px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.tb{background:transparent;border:0;color:#fff;padding:5px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.16)}
.tb[disabled]{opacity:.35;cursor:default}
.tb.on{background:var(--acc);}
.spacer{flex:1}
#main{flex:1;display:flex;min-height:0;position:relative}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-color:var(--line);border-style:solid;border-width:0}
#left{width:250px;border-right-width:1px}
#right{width:330px;border-left-width:1px}
.tabs{display:flex;background:#e6e9ee;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;border:0;background:transparent;padding:7px 4px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:12px}
.tabs button.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--acc)}
.tabbody{flex:1;overflow:auto;padding:8px;min-height:0}
.tabbody>section{display:none}
.tabbody>section.on{display:block}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#dfe3e8}
#toolbar{display:flex;gap:4px;padding:5px 6px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#toolbar .tg{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
#toolbar .tg:last-child{border-right:0}
.tool{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap}
.tool:hover{background:var(--acc2)}
.tool.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tool[disabled]{opacity:.4;cursor:default}
.tool kbd{font-size:10px;opacity:.65;border:1px solid currentColor;border-radius:3px;padding:0 3px}
#views{flex:1;display:flex;min-height:0;position:relative}
#views.stack{flex-direction:column}
.pane{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:#fbfaf7}
#views.m-2d #pane3d,#views.m-3d #pane2d{display:none}
#pane3d{background:#cfd8de;border-left:2px solid #fff}
#views.stack #pane3d{border-left:0;border-top:2px solid #fff}
#c2d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:default}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;z-index:5;display:flex;gap:4px;flex-wrap:wrap}
.overlay.tl{top:6px;left:6px}.overlay.tr{top:6px;right:6px}.overlay.bl{bottom:6px;left:6px}
.chip{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip:hover{background:var(--acc2)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.static{cursor:default;font-size:11px;color:var(--muted);max-width:100%}
.lbl3d{background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:1px 5px;font-size:11px;line-height:1.25;text-align:center;white-space:nowrap;pointer-events:none;color:#111}
.lbl3d .ar{font-weight:700;font-size:12px}.lbl3d .en{font-weight:600}.lbl3d .dm{color:#444}
.lbl3d.door{background:#0b7285;color:#fff;border-color:#0b7285;font-weight:700;padding:0 4px}
.errbox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;text-align:center;background:rgba(250,240,240,.96);color:#7a1b1b;z-index:9}
.errbox.show{display:flex}
#statusbar{display:flex;gap:12px;padding:3px 8px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
#statusbar .badge{cursor:pointer;border-radius:10px;padding:0 8px;color:#fff;background:var(--ok)}
#statusbar .badge.w{background:var(--amber)}#statusbar .badge.e{background:var(--warn)}
/* panels content */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.card h3,.tabbody h3{margin:0 0 6px;font-size:13px}
.card h4{margin:8px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:2px;flex:1;min-width:92px;margin-bottom:6px}
.fld>span{font-size:11px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:4px 6px;border:1px solid #bcc4cf;border-radius:5px;background:#fff}
.fld input[type=color]{width:100%;height:28px;padding:1px;border:1px solid #bcc4cf;border-radius:5px;background:#fff}
.fld input[type=range]{width:100%}
.fld.chk{flex-direction:row;align-items:center;gap:6px;min-width:140px}
.fld.chk>span{color:var(--ink);font-size:12px}
.fld.chk input{margin:0}
.fld [dir=rtl],input.ar{direction:rtl;text-align:right}
.btn{border:1px solid #aab3be;background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer}
.btn:hover{background:var(--acc2)}.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.dng{color:var(--warn);border-color:#e3b0b0}
.btn.sm{padding:2px 6px;font-size:12px}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
table.t{border-collapse:collapse;width:100%;font-size:12px;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{background:#eef1f4;position:sticky;top:0;font-weight:600}
table.t tr.sel td{background:#fff3d6}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:var(--acc2)}
table.t tr.tot td{font-weight:700;background:#eef1f4}
.li{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:4px;cursor:pointer}
.li:hover{background:var(--acc2)}.li.sel{border-color:var(--sel);background:#fff7e6;box-shadow:inset 3px 0 0 var(--sel)}
.li .dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex-shrink:0}
.li .nm{flex:1;min-width:0}.li .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm small{color:var(--muted)}
.li .ic{border:0;background:transparent;cursor:pointer;padding:2px 4px;border-radius:4px}.li .ic:hover{background:#e6e9ee}
.ar,[dir=rtl]{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Arial",sans-serif}
.iss{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;border-left:4px solid var(--muted);background:#fff;border-radius:4px;margin-bottom:4px;cursor:pointer;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.iss:hover{background:var(--acc2)}
.iss.error{border-left-color:var(--warn)}.iss.warn{border-left-color:var(--amber)}.iss.info{border-left-color:#4c6ef5}
.iss small{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.banner{background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:8px}
.seg{display:flex;border:1px solid #aab3be;border-radius:6px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;border:0;background:#fff;padding:4px;cursor:pointer;border-right:1px solid #aab3be}.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}.kv b{font-weight:600}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.lib button{text-align:left;padding:6px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}.lib button:hover{background:var(--acc2)}.lib button.on{border-color:var(--acc);background:var(--acc2)}
.lib small{display:block;color:var(--muted)}
kbd{background:#eef1f4;border:1px solid #c5ccd5;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
#toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;pointer-events:none;align-items:center}
#toast div{background:#222b36;color:#fff;border-radius:7px;padding:7px 12px;box-shadow:0 3px 12px rgba(0,0,0,.3);max-width:80vw}
#toast div.err{background:#a61e1e}
#modalback{position:fixed;inset:0;background:rgba(10,16,24,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
#modalback.show{display:flex}
#modal{background:#fff;border-radius:10px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#modal h2{margin:0 0 8px;font-size:16px}
#modal ul{margin:6px 0 6px 18px;padding:0}
#fatal{position:fixed;left:0;right:0;top:0;z-index:200;background:#a61e1e;color:#fff;padding:8px 12px;display:none;white-space:pre-wrap}
#drawerbtns{display:none}
.hidden{display:none!important}
@media (max-width:1050px){
  #left,#right{position:absolute;top:0;bottom:0;z-index:25;width:min(92vw,340px);transition:transform .2s,visibility .2s;box-shadow:0 0 18px rgba(0,0,0,.3)}
  #left:not(.open),#right:not(.open){visibility:hidden}
  #left{left:0;transform:translateX(-110%)}#left.open{transform:none}
  #right{right:0;transform:translateX(110%)}#right.open{transform:none}
  #drawerbtns{display:flex}
}
@media (max-width:700px){
  #topbar,#toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  #topbar>*,#toolbar>*{flex:0 0 auto}
  #hint2d{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 110px)}
  #toast div{font-size:12px;max-width:86vw}
  #topbar .brand small{display:none}
  .tool kbd{display:none}
  .tool{padding:4px 6px}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"},"integrity":{"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js":"sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ","https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js":"sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP","https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS2DRenderer.js":"sha384-oxPlnJSeUCYU9W3RMQswb4S/vFd4Bhxuy1Ffx0V2KJakWeb6n1gaqUtSE9Ic/F72"}}
</script>

<body>
<div id="fatal"></div>
<div id="app">
  <header id="topbar">
    <div class="brand">Restaurant Plan Editor<small>schematic planning model</small></div>
    <div class="grp" id="drawerbtns">
      <button class="tb" id="btnLeft" title="Rooms and library">☰ Rooms</button>
      <button class="tb" id="btnRight" title="Inspector, display, checks">⚙ Panels</button>
    </div>
    <div class="grp">
      <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="tb" id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
    </div>
    <div class="grp" id="viewSeg">
      <button class="tb" data-view="2d" title="2D plan only (1)">2D</button>
      <button class="tb" data-view="split" title="Side by side (2)">Split</button>
      <button class="tb" data-view="3d" title="3D only (3)">3D</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="tb" id="btnExport" title="Export complete editable plan as JSON">⭳ JSON</button>
      <button class="tb" id="btnImport" title="Import a previously exported JSON plan">⭱ Import</button>
      <button class="tb" id="btnPng2d" title="Export current 2D view as PNG">PNG 2D</button>
      <button class="tb" id="btnPng3d" title="Export current 3D view as PNG">PNG 3D</button>
    </div>
    <div class="grp">
      <button class="tb" id="btnFull" title="Fullscreen">⛶</button>
      <button class="tb" id="btnResetAll" title="Reset the complete plan">Reset plan</button>
    </div>
    <input aria-label="Import plan JSON file" type="file" id="fileImport" accept=".json,application/json" class="hidden">
  </header>
  <div id="main">
    <aside id="left">
      <div class="tabs" id="leftTabs">
        <button data-tab="rooms" class="on">Rooms</button>
        <button data-tab="objects">Objects</button>
        <button data-tab="schedule">Areas</button>
        <button data-tab="library">Library</button>
      </div>
      <div class="tabbody" id="leftBody">
        <section data-tab="rooms" class="on"></section>
        <section data-tab="objects"></section>
        <section data-tab="schedule"></section>
        <section data-tab="library"></section>
      </div>
    </aside>
    <div id="center">
      <div id="toolbar">
        <div class="tg" id="tgSel"></div>
        <div class="tg" id="tgAdd"></div>
        <div class="tg" id="tgAct"></div>
        <div class="tg" id="tgView"></div>
      </div>
      <div id="views" class="m-split">
        <div class="pane" id="pane2d">
          <canvas id="c2d" role="img" aria-label="2D floor plan"></canvas>
          <div class="overlay bl" style="right:6px"><span class="chip static" id="hint2d"></span></div>
          <div class="overlay tr">
            <button class="chip" id="zFit" title="Fit plan">Fit</button>
            <button class="chip" id="zIn">＋</button>
            <button class="chip" id="zOut">－</button>
          </div>
        </div>
        <div class="pane" id="pane3d">
          <div id="gl"></div>
          <div class="errbox" id="err3d"></div>
          <div class="overlay tl" id="camBtns">
            <button class="chip" data-cam="iso">Isometric</button>
            <button class="chip" data-cam="top">Top</button>
            <button class="chip" data-cam="front">Front</button>
            <button class="chip" data-cam="side">Side</button>
            <button class="chip" data-cam="focus">Focus room</button>
            <button class="chip" data-cam="reset">Reset</button>
          </div>
          <div class="overlay bl" id="modeBtns">
            <button class="chip" data-mode="solid">Solid</button>
            <button class="chip" data-mode="wire">Wireframe</button>
            <button class="chip" data-mode="xray">X-ray</button>
          </div>
        </div>
      </div>
      <div id="statusbar"><span id="stPos">x 0.00  z 0.00 m</span><span id="stSel">No selection</span><span id="stTip" class="spacer"></span><span class="badge" id="stBadge">0 warnings</span></div>
    </div>
    <aside id="right">
      <div class="tabs" id="rightTabs">
        <button data-tab="insp" class="on">Inspector</button>
        <button data-tab="disp">Display</button>
        <button data-tab="checks">Checks</button>
        <button data-tab="help">Help</button>
      </div>
      <div class="tabbody" id="rightBody">
        <section data-tab="insp" class="on"></section>
        <section data-tab="disp"></section>
        <section data-tab="checks"></section>
        <section data-tab="help"></section>
      </div>
    </aside>
  </div>
  <div id="toast"></div>
</div>
<div id="modalback"><div id="modal" role="dialog" aria-modal="true"></div></div>
<script type="module">
/* =====================================================================
   RESTAURANT PLAN EDITOR — single-file application
   Sections: 1 config/reference data · 2 model & geometry · 3 walls & doors
             4 validation · 5 persistence · 6 2D editor · 7 3D scene
             8 UI panels · 9 startup
   One serializable plan object (S.plan) is the source of truth.
   ===================================================================== */
'use strict';

/* ---------------------------------------------------------------------
   1. CONFIGURATION AND REFERENCE DATA
   --------------------------------------------------------------------- */
const LS_KEY = 'restaurantPlanEditor.v2';
const FORMAT = 'restaurant-plan-editor';
const FORMAT_VERSION = 1;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r3 = v => Math.round(v * 1000) / 1000;
const r2 = v => Math.round(v * 100) / 100;
const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
const fnum = v => String(r3(v));
const deg = r => r * 180 / Math.PI;
const rad = d => d * Math.PI / 180;

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (tag === 'button') e.type = 'button';
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const CATEGORIES = {
  receiving:   { label: 'Receiving / dispatch', floor: '#c4c2bb', mat: 'concrete' },
  storage:     { label: 'Dry storage',          floor: '#c8c6c0', mat: 'concrete' },
  cold:        { label: 'Chilled storage',      floor: '#bcd2dc', mat: 'epoxy' },
  dining:      { label: 'Dining',               floor: '#c9a27a', mat: 'wood' },
  electrical:  { label: 'Electrical / utility', floor: '#d3c9b5', mat: 'concrete' },
  wash:        { label: 'Washing',              floor: '#aebfc7', mat: 'tile' },
  circulation: { label: 'Circulation',          floor: '#dcdad3', mat: 'epoxy' },
  prep:        { label: 'Food preparation',     floor: '#b9bcc0', mat: 'tile' },
  kitchen:     { label: 'Kitchen',              floor: '#b4b8bd', mat: 'tile' },
  other:       { label: 'Other zone',           floor: '#d0cfc8', mat: 'concrete' }
};
const FLOOR_MATS = {
  tile: { label: 'Quarry / ceramic tile', rough: 0.35, metal: 0.05 },
  concrete: { label: 'Polished concrete', rough: 0.8, metal: 0 },
  wood: { label: 'Timber / laminate', rough: 0.55, metal: 0 },
  epoxy: { label: 'Epoxy resin', rough: 0.25, metal: 0.05 },
  vinyl: { label: 'Commercial vinyl', rough: 0.5, metal: 0 },
  stone: { label: 'Stone', rough: 0.7, metal: 0 }
};
const WALL_MATS = {
  plaster: { label: 'Painted plaster', rough: 0.9 },
  tile: { label: 'Wall tile', rough: 0.3 },
  concrete: { label: 'Concrete', rough: 0.85 },
  panel: { label: 'Hygienic panel', rough: 0.4 }
};
const DOOR_MATS = {
  wood: { label: 'Timber', rough: 0.6, metal: 0, opacity: 1 },
  metal: { label: 'Painted metal', rough: 0.4, metal: 0.3, opacity: 1 },
  glass: { label: 'Glazed', rough: 0.1, metal: 0, opacity: 0.35 }
};

/* Furniture & equipment library (all illustrative). Sizes in metres. */
const LIB = {
  diningTable: { label: 'Dining table', w: 1.2, d: 0.8, h: 0.75, elev: 0, color: '#a67c52' },
  chair:       { label: 'Chair', w: 0.45, d: 0.45, h: 0.9, elev: 0, color: '#7a5230' },
  shelf:       { label: 'Storage shelf / rack', w: 1.2, d: 0.45, h: 1.9, elev: 0, color: '#8d9aa5' },
  pallet:      { label: 'Pallet staging', w: 1.2, d: 0.8, h: 0.5, elev: 0, color: '#b08d57' },
  prepTable:   { label: 'Preparation table', w: 1.8, d: 0.8, h: 0.9, elev: 0, color: '#c5ccd2' },

/* Build wall segments from room edges. Shared edges become one partition

    add(lines.H, q.z, q.x, q.x + q.w, r.id); add(lines.H, q.z + q.d, q.x, q.x + q.w, r.id);
    add(lines.V, q.x, q.z, q.z + q.d, r.id); add(lines.V, q.x + q.w, q.z, q.z + q.d, r.id);

    for (const [key, ivs] of map) {

/* ---------------------------------------------------------------------
   4. VALIDATION (visual planning aids only)
   --------------------------------------------------------------------- */
function validate(plan) {

  for (const r of rooms) {
    const f = fp(r), e = stExt(r), T = { type: 'room', id: r.id };
    if (!(r.L > 0 && r.W > 0)) add('error', 'room-dim', roomName(r) + ': stated length/width must be positive.', T);
    if (!(f.w > 0 && f.d > 0)) add('error', 'room-modeled', roomName(r) + ': modeled footprint must be positive.', T);
    if (Math.abs(f.w - e.w) > 1e-6 || Math.abs(f.d - e.d) > 1e-6)
      add('warn', 'room-stated-modeled', roomName(r) + ': modeled footprint ' + f2(f.w) + ' × ' + f2(f.d) + ' m differs from stated ' + f2(e.w) + ' × ' + f2(e.d) + ' m.', T);
    if (r.approx) add('info', 'room-approx', roomName(r) + ': ' + r.approx, T);
    if (isZone(plan, r)) {
      const q = rectOf(r), pq = rectOf(roomById(plan, r.zoneOf)), t = 0.01;
      if (q.x < pq.x - t || q.z < pq.z - t || q.x + q.w > pq.x + pq.w + t || q.z + q.d > pq.z + pq.d + t) add('warn', 'zone-outside', roomName(r) + ' extends outside its parent room.', T);
    }
  }
  for (let i = 0; i < rooms.length; i++) for (let j = i + 1; j < rooms.length; j++) {
    if (rooms[i].zoneOf === rooms[j].id || rooms[j].zoneOf === rooms[i].id) continue;
    const a = rectOf(rooms[i]), b = rectOf(rooms[j]);
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oz = Math.min(a.z + a.d, b.z + b.d) - Math.max(a.z, b.z);
    if (ox > 0.01 && oz > 0.01) add('warn', 'room-overlap', roomName(rooms[i]) + ' overlaps ' + roomName(rooms[j]) + ' by ' + f2(ox * oz) + ' m².', { type: 'room', id: rooms[i].id }, '|' + rooms[j].id);
  }
  // walls
  for (const w of walls) {
    const i = wallInfo(plan, w), T = { type: 'wall', id: w.id };
    if (i.len < 0.05) add('error', 'wall-short', 'Wall ' + w.id + ' is almost zero length.', T);
    if (!(i.t > 0)) add('error', 'wall-thick', 'Wall ' + w.id + ' has non-positive thickness.', T);
    if (!(i.H > 0)) add('error', 'wall-height', 'Wall ' + w.id + ' has non-positive height.', T);
  }
  for (let i = 0; i < walls.length; i++) for (let j = i + 1; j < walls.length; j++) {
    const ov = axisOverlap(walls[i], walls[j]);
    if (ov > 0.02) add('warn', 'wall-overlap', 'Walls ' + walls[i].id + ' and ' + walls[j].id + ' overlap along ' + f2(ov) + ' m (duplicate surfaces).', { type: 'wall', id: walls[i].id }, '|' + walls[j].id);
  }
  for (const w of walls) {
    const i = wallInfo(plan, w);
    for (const p of [[w.x1, w.z1], [w.x2, w.z2]]) {
      const touch = walls.some(o => o !== w && segDist(p[0], p[1], o.x1, o.z1, o.x2, o.z2).d <= wallInfo(plan, o).t / 2 + 0.03);
      if (!touch) { add('warn', 'wall-free', 'Wall ' + w.id + ' has a disconnected end near (' + f2(p[0]) + ', ' + f2(p[1]) + ').', { type: 'wall', id: w.id }, '|' + f2(p[0]) + ',' + f2(p[1])); break; }
    }
  }

    if (isZone(plan, r)) continue;
    const q = rectOf(r); if (!(q.w > 0 && q.d > 0)) continue;

    for (let s = 0.125; s < q.d; s += 0.25) { pts.push([q.x, q.z + s]); pts.push([q.x + q.w, q.z + s]); }
    for (const p of pts) {
      const ok = walls.some(w => segDist(p[0], p[1], w.x1, w.z1, w.x2, w.z2).d <= wallInfo(plan, w).t / 2 + 0.06);
      if (!ok) { gap = p; break; }
    }
    if (gap) add('warn', 'room-gap', roomName(r) + ': boundary has no wall near (' + f2(gap[0]) + ', ' + f2(gap[1]) + '). Use “Rebuild walls” or add a wall.', { type: 'room', id: r.id });
  }

    const w = wallById(plan, d.hostWallId);
    if (!w) { add('error', 'door-nohost', dn(d) + ' has no valid host wall (its location is no longer on a wall). Drag it onto a wall or delete it.', T); continue; }
    const i = wallInfo(plan, w);
    (byHost[w.id] = byHost[w.id] || []).push(d);
    if (d.width > i.len + 1e-6) add('error', 'door-wide', dn(d) + ' is ' + f2(d.width) + ' m wide but its host wall is only ' + f2(i.len) + ' m long. The visible opening is clipped.', T);
    else if (d.offset - d.width / 2 < -1e-6 || d.offset + d.width / 2 > i.len + 1e-6) add('warn', 'door-ends', dn(d) + ' extends beyond the end of its host wall; the visible opening is clipped.', T);
    if (d.height > i.H + 1e-6) add('warn', 'door-tall', dn(d) + ' (' + f2(d.height) + ' m) is taller than its wall (' + f2(i.H) + ' m); the opening is clipped to wall height.', T);
    if (d.uncertain) add('info', 'door-unc', dn(d) + ': ' + (d.note || 'uncertain placement.'), T);
  }

    for (let i = 0; i < ds.length; i++) for (let j = i + 1; j < ds.length; j++) {
      const a = ds[i], b = ds[j];

    }

  return out;
}
function issueCounts(issues) { return { e: issues.filter(i => i.sev === 'error').length, w: issues.filter(i => i.sev === 'warn').length, i: issues.filter(i => i.sev === 'info').length }; }

/* ---------------------------------------------------------------------
   5. PERSISTENCE: sanitising, export, import, local storage

function sanitizePlan(raw) {

    const L = num(r.L, NaN, 0.01, 500, 'room[' + n + '].L'), W = num(r.W, NaN, 0.01, 500, 'room[' + n + '].W');
    if (!isFinite(L) || !isFinite(W)) { errs.push('Room #' + (n + 1) + ' needs finite positive L and W.'); return; }

      x: num(rf.x, o.x, -1e4, 1e4, 'ref.x'), z: num(rf.z, o.z, -1e4, 1e4, 'ref.z'), area: 0,

    await modal('Import failed — current plan kept', [h('p', {}, 'The file could not be imported and your current plan was not changed.'), h('pre', { style: { whiteSpace: 'pre-wrap', background: '#fff0f0', padding: '6px', borderRadius: '6px', fontSize: '12px' } }, e.message)], [{ label: 'OK', value: 'ok', cls: 'pri' }]);

}
function exportPng2D() {
  try {
    const W = 2000, HH = 1300, cv = document.createElement('canvas'); cv.width = W; cv.height = HH;
    const b = planBounds(), cam = { cx: b.cx, cz: b.cz, scale: Math.min((W - 120) / b.w, (HH - 120) / b.d) };
    draw2D(cv.getContext('2d'), W, HH, cam, true);

  } catch (e) { toast('2D PNG export failed: ' + e.message, true); }
}
function exportPng3D() {
  if (!S.v3) { toast('3D view is unavailable, so there is nothing to export', true); return; }
  try { download('restaurant-plan-3d.png', S.v3.png()); toast('3D view exported as PNG'); } catch (e) { toast('3D PNG export failed: ' + e.message, true); }
}

/* ---- refresh cycle ---- */
function a11yPass() {
  document.querySelectorAll('button').forEach(b => { if (!b.getAttribute('aria-label')) { const t = b.title || (b.textContent || '').trim(); if (t && !(b.textContent || '').trim()) b.setAttribute('aria-label', t); } });
  document.querySelectorAll('[data-tab]').forEach(b => { if (b.tagName === 'BUTTON') { b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', b.classList.contains('on') ? 'true' : 'false'); } });
  document.querySelectorAll('input,select,textarea').forEach(el => { if (el.getAttribute('aria-label') || el.type === 'file') return; const f = el.closest('.fld'); const l = f && (f.querySelector('label') || f.querySelector('span')); const t = l ? l.textContent.trim() : (el.title || el.placeholder || ''); if (t) el.setAttribute('aria-label', t); });
  document.querySelectorAll('[dir=rtl]:not([lang])').forEach(el => el.setAttribute('lang', 'ar'));
}
function refreshUI() {
  S.dirtyUI = false;
  S.issues = validate(S.plan);
  const c = issueCounts(S.issues), b = $('#stBadge');
  b.textContent = c.e ? c.e + ' error' + (c.e > 1 ? 's' : '') + ' · ' + c.w + ' warning' + (c.w === 1 ? '' : 's') : c.w ? c.w + ' warning' + (c.w > 1 ? 's' : '') : 'No warnings';
  b.className = 'badge' + (c.e ? ' e' : c.w ? ' w' : '');
  $('#btnUndo').disabled = !S.undo.length; $('#btnRedo').disabled = !S.redo.length;
  $('#tSnapGrid').classList.toggle('on', S.plan.settings.snapGrid); $('#tSnapCorner').classList.toggle('on', S.plan.settings.snapCorners);
  $$('#modeBtns .chip').forEach(x => x.classList.toggle('on', x.dataset.mode === S.display.mode3d));
  const o = selObj(), t = S.sel && S.sel.type;
  $('#stSel').textContent = o ? ({ room: 'Room: ' + o.nameEn, wall: 'Wall ' + o.id, door: 'Door ' + (o.refNo || o.id), equip: 'Item: ' + (o.name || o.type) })[t] : 'No selection';
  const lt = activeTab('#leftBody'), rt = activeTab('#rightBody');
  const L = { rooms: renderRooms, objects: renderObjects, schedule: renderSchedule, library: renderLibrary }[lt]; if (L) L($('#leftBody > section.on'));
  if (rt === 'disp') { if (!$('#rightBody > section.on').contains(document.activeElement) || S.forceInsp) { renderDisplay($('#rightBody > section.on')); } }
  else if (rt === 'checks') renderChecks($('#rightBody > section.on'));
  else if (rt === 'insp') {
    const sec = $('#rightBody > section.on');
    if (S.dirtyInsp && (!sec.contains(document.activeElement) || S.forceInsp)) { S.dirtyInsp = false; S.forceInsp = false; renderInspector(sec); }
  }
  if (rt === 'disp' && S.forceInsp) S.forceInsp = false;
  a11yPass();
  S.dirty2d = true;
}
/* ---------------------------------------------------------------------
   9. STARTUP, KEYBOARD, MAIN LOOP
   --------------------------------------------------------------------- */
function showFatal(msg) {
  const f = $('#fatal'); f.style.display = 'block';
  f.textContent = 'Application error: ' + msg + '\nIf this persists, reload the page; clearing this site’s local storage resets the saved plan.';
}
window.addEventListener('error', e => { if (e.message && !/ResizeObserver/.test(e.message)) showFatal(e.message); });
window.addEventListener('unhandledrejection', e => showFatal(String((e.reason && e.reason.message) || e.reason)));

function rotateSelection(back) {
  const o = selObj(); if (!o) { toast('Select a room or equipment to rotate'); return; }
  if (S.sel.type === 'room') rotateRoom(o);
  else if (S.sel.type === 'equip') { if (!lockedCheck(o, 'Equipment')) edit(() => { o.rot = ((o.rot || 0) + (back ? -90 : 90) + 360) % 360; }); }
  else toast('Rotate works on rooms and equipment');
}
function onKeyDown(e) {
  if (e.key === 'Shift') V2.shift = true;
  const modalOpen = $('#modalback').classList.contains('show');
  if (e.key === 'Escape') {
    if (modalOpen) { closeModal('cancel'); return; }
    if (V2.drag) abortDrag(); V2.wallStart = null; select(null); S.dirty2d = true; return;
  }
  if (modalOpen) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (mod || e.altKey) return;
  if (k === ' ') { V2.space = true; e.preventDefault(); return; }
  const tools = { v: 'select', m: 'move', s: 'resize', t: 'rotate', a: 'addRoom', w: 'addWall', d: 'addDoor', q: 'addEquip' };
  if (tools[k]) { setTool(tools[k]); return; }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSelection(); return; }
  if (k === 'r') { rotateSelection(e.shiftKey); return; }
  if (k === 'g') { edit(p => { p.settings.snapGrid = !p.settings.snapGrid; }); toast('Grid snap ' + (S.plan.settings.snapGrid ? 'on' : 'off')); return; }
  if (k === 'f') { fit2D(); return; }
  if (k === '1') { setViewMode('2d'); return; } if (k === '2') { setViewMode('split'); return; } if (k === '3') { setViewMode('3d'); return; }
  const step = e.shiftKey ? 0.1 : S.plan.settings.gridSize, arrows = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] };
  if (arrows[k]) { e.preventDefault(); nudgeSelection(...arrows[k]); }
}

function wire() {
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
  $$('#viewSeg .tb').forEach(b => b.onclick = () => setViewMode(b.dataset.view));
  $('#btnExport').onclick = exportJSON;
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = e => { importFile(e.target.files[0]); e.target.value = ''; };
  $('#btnPng2d').onclick = exportPng2D; $('#btnPng3d').onclick = exportPng3D;
  $('#btnFull').onclick = toggleFullscreen; $('#btnResetAll').onclick = resetAll;
  $('#btnLeft').onclick = () => { $('#right').classList.remove('open'); $('#left').classList.toggle('open'); };
  $('#btnRight').onclick = () => { $('#left').classList.remove('open'); $('#right').classList.toggle('open'); };
  $('#stBadge').onclick = () => showRightTab('checks');
  $$('#camBtns .chip').forEach(b => b.onclick = () => { if (!S.v3) { toast('3D view unavailable', true); return; } S.v3.setPreset(b.dataset.cam); });
  $$('#modeBtns .chip').forEach(b => b.onclick = () => setDisplay('mode3d', b.dataset.mode));
  $('#center').addEventListener('pointerdown', () => { $('#left').classList.remove('open'); $('#right').classList.remove('open'); });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', e => { if (e.key === ' ') V2.space = false; if (e.key === 'Shift') V2.shift = false; });
  window.addEventListener('blur', () => { V2.space = false; V2.shift = false; });
  $('#modalback').addEventListener('pointerdown', e => { if (e.target.id === 'modalback') closeModal('cancel'); });
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(exportObject())); } catch (e) { /* ignore */ } });
  new ResizeObserver(updateStack).observe($('#views'));
  initTabs('#leftTabs', '#leftBody'); initTabs('#rightTabs', '#rightBody');
}

let lastUI = 0;
function loop(now) {
  requestAnimationFrame(loop);
  try {
    if (S.dirtyUI && now - lastUI > 100) { lastUI = now; refreshUI(); }
    if (S.dirty2d && V2.w && S.viewMode !== '3d') { S.dirty2d = false; V2.ctx.setTransform(V2.dpr, 0, 0, V2.dpr, 0, 0); draw2D(V2.ctx, V2.w, V2.h, S.cam2, false); }
    if (S.v3) S.v3.frame(now);
  } catch (e) { console.error(e); if (!loop.warned) { loop.warned = true; toast('Rendering error: ' + e.message, true); } }
}

(async function main() {
  try {
    const saved = loadSaved();
    if (saved) {
      S.plan = saved.plan; S.display = saved.display;
      if (saved.cam2 && isFinite(saved.cam2.cx) && isFinite(saved.cam2.cz) && isFinite(saved.cam2.scale)) { S.cam2 = { cx: saved.cam2.cx, cz: saved.cam2.cz, scale: clamp(saved.cam2.scale, 3, 160) }; V2.userView = true; }
      else V2.needFit = true;
    } else { S.plan = makeDefaultPlan(); V2.needFit = true; }
    buildToolbar(); wire(); init2D(); setTool('select');
    renderHelp($('#rightBody > section[data-tab=help]'));
    setViewMode(window.innerWidth >= 1100 ? 'split' : '2d');
    updateStack(); refreshUI(); resize2D();
    if (!saved) toast('Loaded the initial reference plan (schematic). Edits save automatically in this browser.');
    else toast('Restored your saved plan from this browser');
    requestAnimationFrame(loop);
    S.v3 = await init3D();
    if (S.v3) { if (!(saved && S.v3.set(saved.cam3))) S.v3.fitCamera(false); S.dirty3d = true; S.v3.resize(); }
  } catch (e) { console.error(e); showFatal(e.message); }
})();
